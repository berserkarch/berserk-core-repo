# =============================================================================
# picom.conf — VM-optimized (dwm / sddm)
# Strategy: zero GPU-heavy features, software rendering safe, tearing-free
# =============================================================================

# -----------------------------------------------------------------------------
# Backend — xrender is the only sane choice in VMs
# glx requires working OpenGL passthrough (rare in KVM/VMware/VBox)
# egl is experimental, skip it
# -----------------------------------------------------------------------------
backend = "xrender";

# -----------------------------------------------------------------------------
# VSync — critical in VMs to prevent tearing without relying on GPU
# -----------------------------------------------------------------------------
vsync = true;

# -----------------------------------------------------------------------------
# Shadows — disabled, pure overhead in VMs
# -----------------------------------------------------------------------------
shadow = false;

# -----------------------------------------------------------------------------
# Fading — disabled, eats CPU for zero benefit in a VM
# -----------------------------------------------------------------------------
fading = false;

# -----------------------------------------------------------------------------
# Opacity — no transparency effects, keep it flat
# -----------------------------------------------------------------------------
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# -----------------------------------------------------------------------------
# Blur — absolutely not in a VM
# -----------------------------------------------------------------------------
blur-background = false;

# -----------------------------------------------------------------------------
# Rounded corners — off, CPU cost not worth it
# -----------------------------------------------------------------------------
corner-radius = 0;

# -----------------------------------------------------------------------------
# Performance tweaks
# -----------------------------------------------------------------------------

# Don't composite windows that are fully occluded — big CPU save
use-ewmh-active-win = true;

# Skip repainting screen when nothing changed.
# DISABLED: with the xrender backend this re-redirects a window the moment a
# dialog maps over it, and the transition leaves the parent stuck transparent
# (seen with Thunar dialogs). xcompmgr never unredirected, which is why it was
# fine. Not worth the tiny CPU save in a VM.
unredir-if-possible = false;

# Mark windows as transparent to skip unnecessary compositing
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Detect per-window opacity hints.
# DISABLED: GTK apps (Thunar) briefly advertise _NET_WM_WINDOW_OPACITY on their
# dialogs; picom honored it and rendered the whole window see-through.
detect-client-opacity = false;

# Use X damage extension to only repaint changed regions.
# DISABLED: on the xrender backend, damage tracking misses regions when a dialog
# maps over its parent, leaving stale/transparent areas that never repaint.
use-damage = false;

# -----------------------------------------------------------------------------
# Logging — set to "warn" in production, "debug" if something's broken
# -----------------------------------------------------------------------------
log-level = "warn";

# -----------------------------------------------------------------------------
# Wintypes — minimal compositing per window type
# Disable shadows/fades globally across all types
# -----------------------------------------------------------------------------
wintypes:
{
  tooltip      = { fade = false; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock         = { shadow = false; clip-shadow-above = true; };
  dnd          = { shadow = false; };
  popup_menu   = { opacity = 1.0; shadow = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; };
  notification = { shadow = false; opacity = 1.0; };
  splash       = { shadow = false; };
  utility      = { shadow = false; };
  dialog       = { shadow = false; };
};
